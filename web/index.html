<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Progen ERP: GST invoicing, stock, books and site costing for Indian businesses.">
  <meta name="theme-color" content="#0B6157">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Progen ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Progen ERP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F6F5F2; }
    @media (prefers-color-scheme: dark) { html, body { background: #121211; } }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .2s ease;
    }
    #boot svg { width: 44px; height: 44px; }
    #boot .bar { width: 96px; height: 2px; background: rgba(11,97,87,.18); overflow: hidden; border-radius: 1px; }
    #boot .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0B6157;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
    @media (prefers-color-scheme: dark) { #boot .bar { background: rgba(95,196,177,.2); } #boot .bar::after { background: #5FC4B1; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading Progen">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#0B6157"/>
      <path d="M35 24V78" stroke="#fff" stroke-width="11" fill="none"/>
      <path d="M29.5 29.5H54A12.75 12.75 0 0 1 54 55H35" stroke="#fff" stroke-width="11" fill="none"/>
      <rect x="50" y="71" width="22" height="7" fill="#fff"/>
    </svg>
    <div class="bar"></div>
  </div>
  <script>
    // Remove the loading screen once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
